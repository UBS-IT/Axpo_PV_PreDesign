# Browser tests of PV Predesign, on every push and pull request: every page of tests/ in headless Chromium, with
# the ArcGIS Maps SDK bundled from npm (tools/headless). The app page itself is checked by hand. The vendored
# libraries (app/vendor) are rebuilt from package-lock.json and must match the committed files, and the toolkit
# workbook (docs/toolkit/toolkit.xlsx) must hold the same values as app/catalog/toolkit.json.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/headless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/headless/package-lock.json
      - run: npm ci
      - name: toolkit workbook matches app/catalog/toolkit.json
        working-directory: ${{ github.workspace }}
        run: python3 -m pip install --quiet openpyxl && python3 scripts/make_toolkit.py --check
      - name: tokens.css and icons.svg match design/ (the design system)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/make_tokens.py --check && python3 scripts/make_icons.py --check
      - name: vendored libraries match package-lock.json
        run: npm run vendor && git status --porcelain -- ../../app/vendor && test -z "$(git status --porcelain -- ../../app/vendor)"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
        env:
          VERBOSE: '1'

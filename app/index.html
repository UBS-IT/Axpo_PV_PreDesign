<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PV Predesign</title>
<link rel="stylesheet" id="esriTheme" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.34/"></script>
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/kit.css">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/shell.css">
</head>
<body>
<div id="narrow" class="narrow" data-i18n="narrow.msg"></div>
<div id="app" class="app">
<header id="top" class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-logo"/></svg></span>PV Predesign<small data-i18n="app.subtitle"></small></div>
  <span class="divider"></span>
  <input id="projName" class="project-name" type="text" data-i18n-aria="top.projName" data-i18n-title="top.projName">
  <span class="divider"></span>
  <div class="grp" role="group" data-i18n-aria="top.fileGroup">
    <button type="button" class="tb icon-only" id="btnNew" data-icon="file-plus" data-i18n-title="top.newTitle" data-i18n-aria="top.new"></button>
    <button type="button" class="tb icon-only" id="btnOpen" data-icon="folder" data-i18n-title="top.openTitle" data-i18n-aria="top.open"></button>
    <button type="button" class="tb icon-only" id="btnSave" data-icon="save" data-i18n-title="top.saveTitle" data-i18n-aria="top.save"></button>
    <button type="button" class="tb icon-only" id="btnSaveAs" data-icon="export" data-i18n-title="top.saveAsTitle" data-i18n-aria="top.saveAs"></button>
  </div>
  <span class="spacer"></span>
  <div class="save-state" role="status" id="saveState"><span class="dot"></span><span id="saveStateText"></span></div>
  <span class="divider"></span>
  <button type="button" class="tb icon-only" id="btnTheme" data-i18n-title="top.theme" data-i18n-aria="top.theme"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-moon"/></svg></button>
</header>

<!-- the workflow: four tabs (ui/tabs.js builds them) and the ribbon of the active tab, whose tools keep their ids -->
<nav id="tabs" class="tabs" role="tablist" data-i18n-aria="tabs.label"></nav>
<section id="ribbon" class="ribbon" data-i18n-aria="ribbon.label">
  <div class="rgroup" data-tab="areas" role="group" hidden>
    <div class="rgroup-tools">
      <button type="button" class="tool large primary" id="areasImport" data-icon="import" data-i18n="ribbon.import" data-i18n-title="areas.import"></button>
    </div>
    <div class="rgroup-label" data-i18n="ribbon.g.import"></div>
  </div>
  <div class="rgroup" data-tab="terrain" role="group" hidden>
    <div class="rgroup-tools">
      <button type="button" class="tool large primary" id="terEsri" data-icon="terrain" data-i18n="ribbon.analyse" data-i18n-title="terrain.esriBtn"></button>
      <button type="button" class="tool large" id="terDtm" data-icon="import" data-i18n="ribbon.ownModel" data-i18n-title="terrain.dtmBtn"></button>
    </div>
    <div class="rgroup-label" data-i18n="ribbon.g.elevation"></div>
  </div>
  <div class="rgroup" data-tab="fields" role="group" hidden>
    <div class="rgroup-tools">
      <button type="button" class="tool large primary" id="btnQuick" data-icon="bolt" data-i18n="ribbon.quick" data-i18n-title="quick.btnTitle"></button>
      <button type="button" class="tool large" id="fOptimise" data-icon="refresh" data-i18n="ribbon.optimise" data-i18n-title="field.optimise"></button>
    </div>
    <div class="rgroup-label" data-i18n="ribbon.g.layout"></div>
  </div>
  <div class="rgroup" data-tab="fields" role="group" hidden>
    <div class="rgroup-tools">
      <button type="button" class="tool large" id="infCC" data-icon="station" data-i18n="infra.addCC" data-i18n-title="infra.addCC"></button>
      <button type="button" class="tool large" id="infCU" data-icon="station" data-i18n="infra.addCU" data-i18n-title="infra.addCU"></button>
      <button type="button" class="tool large" id="infCT" data-icon="station" data-i18n="infra.addCT" data-i18n-title="infra.addCT"></button>
    </div>
    <div class="rgroup-label" data-i18n="ribbon.g.stations"></div>
  </div>
  <div class="rgroup" data-tab="output" role="group" hidden>
    <div class="rgroup-tools">
      <button type="button" class="tool large primary" id="outReport" data-icon="report" data-i18n="ribbon.pdf" data-i18n-title="out.reportBtn"></button>
      <button type="button" class="tool large" id="outKml" data-icon="globe" data-i18n="ribbon.kmz" data-i18n-title="out.kml"></button>
    </div>
    <div class="rgroup-label" data-i18n="ribbon.g.firstLook"></div>
  </div>
  <div class="rgroup" data-tab="output" role="group" hidden>
    <div class="rgroup-tools">
      <button type="button" class="tool large" id="outShp" data-icon="vector" data-i18n="ribbon.shp" data-i18n-title="out.shp"></button>
      <button type="button" class="tool large" id="outGpkg" data-icon="database" data-i18n="ribbon.gpkg" data-i18n-title="out.gpkg"></button>
      <button type="button" class="tool large" id="outDxf" data-icon="pen" data-i18n="ribbon.dxf" data-i18n-title="out.dxf"></button>
      <button type="button" class="tool large" id="outBoq" data-icon="table" data-i18n="ribbon.boq" data-i18n-title="out.boq"></button>
      <button type="button" class="tool large" id="outGeojson" data-icon="braces" data-i18n="ribbon.geojson" data-i18n-title="out.geojson"></button>
    </div>
    <div class="rgroup-label" data-i18n="ribbon.g.engineering"></div>
  </div>
  <div class="ribbon-context" id="ribbonCtx"></div>
</section>

<main id="workspace" class="workspace" data-i18n-aria="workspace.label">
  <!-- Layers: the objects of the site by category, floating over the map on the left (ui/layers.js) -->
  <aside id="leftPanel" class="panel left" aria-labelledby="collTitle">
    <header class="panel-h"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-layers"/></svg><div class="ttl"><b id="collTitle" data-i18n="coll.title"></b><small id="collSub"></small></div>
      <button type="button" class="ibtn" id="collClose" data-icon="collapse-left" data-i18n-title="coll.close" data-i18n-aria="coll.close"></button></header>
    <div class="panel-b" id="collPanel"><div id="areaCats"></div></div>
    <div class="panel-f" id="dimsRow" hidden><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-dimension"/></svg><span class="ttl"><b data-i18n="tools.dims"></b><small id="dimsCount"></small></span><button type="button" class="ibtn" id="dimsShow" aria-pressed="true" data-i18n-title="tools.dimShow" data-i18n-aria="tools.dimShow"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-eye"/></svg></button><button type="button" class="ibtn" id="dimsClear" data-i18n-title="tools.dimClear" data-i18n-aria="tools.dimClear"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-trash"/></svg></button></div>
  </aside>
  <button type="button" class="strip left" id="collTab" aria-expanded="false" aria-controls="collPanel" data-i18n-title="coll.toggle" hidden><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-layers"/></svg><span data-i18n="coll.title"></span><span class="tot" id="collTot"></span><span class="dots" id="collDots"></span></button>

  <div id="mapStack">
    <div id="view"><div id="banner" class="banner" hidden></div></div>
    <div id="view3d"></div>
    <!-- 2D / 3D is a view of the map, not a step: the side panel keeps its step -->
    <!-- the scale bar, bottom centre (the SDK has no such corner: its own container) -->
    <div id="scalebar"></div>
    <aside id="measureCard" class="mapcard measure" hidden>
      <div class="mapcard-h"><b data-i18n="tools.measure"></b><div class="chips plain" role="radiogroup" data-i18n-aria="tools.measure"><button type="button" class="chip" role="radio" data-measure="distance" aria-checked="false" data-i18n="tools.distance"></button><button type="button" class="chip" role="radio" data-measure="area" aria-checked="false" data-i18n="tools.area"></button></div><button type="button" class="x" id="measureClose" data-i18n-title="tools.measureClose" data-i18n-aria="tools.measureClose"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"/></svg></button></div>
      <div class="mapcard-b"><div id="measureBox"></div><p class="hint" data-i18n="tools.measureHint"></p></div>
    </aside>
    <div class="mapchips" role="group" data-i18n-aria="map.mode">
      <button type="button" data-mode="2d" aria-pressed="true">2D</button>
      <button type="button" data-mode="3d" aria-pressed="false">3D</button>
    </div>
    <aside id="d3Card" class="mapcard">
      <div class="mapcard-h"><b data-i18n="d3.title"></b><button type="button" class="x" id="d3CardMin" data-i18n-title="d3.minimise" data-i18n-aria="d3.minimise"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chevron-down"/></svg></button></div>
      <div class="mapcard-b"><div id="d3Panel"></div></div>
    </aside>
  </div>


  <button type="button" class="strip right" id="rpOpen" data-i18n-title="panel.open" hidden><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-settings"/></svg><span data-i18n="panel.properties"></span></button>
  <!-- Properties: the sections of the steps of the active tab, floating over the map on the right -->
  <aside id="rightPanel" class="panel right" aria-labelledby="rpTitle">
    <header class="panel-h"><div class="ttl"><b id="rpTitle"></b><small id="rpSub"></small></div>
      <button type="button" class="ibtn" id="rpClose" data-icon="collapse-right" data-i18n-title="panel.close" data-i18n-aria="panel.close"></button></header>
    <div class="panel-b" id="side">


    <!-- 1 · site -->
    <section class="step" data-step="areas" hidden>
      <header class="stephd"><span class="num">1</span><div><h2 data-i18n="step.areas"></h2><p data-i18n="step.areas.sub"></p></div></header>
      <p class="hint" data-i18n="areas.importHint"></p>
      <details class="gloss"><summary data-i18n="areas.gloss2" data-icon="info"></summary>
        <ul><li data-i18n="areas.importMore1"></li><li data-i18n="areas.importMore2"></li><li data-i18n="areas.importMore3"></li></ul>
      </details>
      <!-- the quick predesign is offered only once there is a site: one primary action per step -->
      <p class="suggest" id="areasQuickRow" hidden><span data-i18n="quick.siteReady"></span>
        <button type="button" class="linkbtn" id="areasQuick" data-icon="bolt" data-i18n="quick.btn" data-i18n-title="quick.btnTitle"></button></p>
      <details class="fold" id="secDraw" open>
        <summary><span class="ico" aria-hidden="true"><svg class="icon" focusable="false"><use href="#i-pen"/></svg></span><span class="ttl"><b data-i18n="draw.title"></b><small data-i18n="draw.sub"></small></span></summary>
        <div class="bd">
          <div class="pstep">
            <div class="pstep-h"><span class="pnum" aria-hidden="true">1</span><div class="pstep-t"><b data-i18n="draw.what"></b><small data-i18n="draw.whatSub"></small></div></div>
            <div class="chips" id="drawCats" role="radiogroup" data-i18n-aria="draw.what"></div>
            <div class="attrs2" id="drawAttrs" hidden></div>
          </div>
          <div class="pstep">
            <div class="pstep-h"><span class="pnum" aria-hidden="true">2</span><div class="pstep-t"><b data-i18n="draw.how"></b><small data-i18n="draw.howSub"></small></div>
              <div class="acts"><button type="button" class="gact" id="drawUndo" data-i18n-title="draw.undo" data-i18n-aria="draw.undo" disabled><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-undo"/></svg></button><button type="button" class="gact" id="drawRedo" data-i18n-title="draw.redo" data-i18n-aria="draw.redo" disabled><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-redo"/></svg></button></div></div>
            <div class="cards" id="drawTools"></div>
            <div class="status" id="drawStatus" role="status"></div>
            <div class="row2 support"><label class="chk"><input type="checkbox" id="drawTyped"> <span data-i18n="tools.typed"></span></label><label class="chk"><input type="checkbox" id="drawLabels"> <span data-i18n="tools.labels"></span></label></div>
          </div>
          <div class="last" id="drawLast" hidden></div>
        </div>
      </details>
      <p class="hint coll-hint"><span data-i18n="areas.collHint"></span> <a href="#" data-coll-open data-i18n="areas.collOpen"></a></p>
      <div class="card">
        <div class="cardhd"><b data-i18n="areas.netTitle"></b></div>
        <label class="lbl" for="boundarySetback" data-i18n="areas.setback"></label>
        <input id="boundarySetback" type="number" min="0" step="0.5">
        <p class="hint" data-i18n="areas.setbackHint"></p>
        <div id="areaSummary"></div>
        <details class="gloss"><summary data-i18n="areas.gloss" data-icon="info"></summary>
          <ul><li data-i18n="areas.gl1"></li><li data-i18n="areas.gl2"></li><li data-i18n="areas.gl3"></li><li data-i18n="areas.gl4"></li></ul>
        </details>
      </div>
    </section>

    <!-- 2 · terrain -->
    <section class="step" data-step="terrain" hidden>
      <header class="stephd"><span class="num">2</span><div><h2 data-i18n="step.terrain"></h2><p data-i18n="step.terrain.sub"></p></div></header>
      <p class="hint" data-i18n="terrain.intro"></p>
      <details class="gloss"><summary data-i18n="terrain.gloss" data-icon="info"></summary>
        <ul><li data-i18n="terrain.introMore1"></li><li data-i18n="terrain.introMore2"></li></ul>
      </details>
      <div class="card">
        <div class="cardhd"><b data-i18n="terrain.model"></b><span class="pill" id="terPill"></span></div>
        <div id="terInfo"></div>
        <div id="terStatus" class="status" role="status" hidden></div>
        <p class="hint" data-i18n="terrain.esriHint"></p>
        <details class="adv">
          <summary data-i18n="terrain.adv" data-icon="info"></summary>
          <label class="lbl" for="terCell" data-i18n="terrain.cell"></label>
          <input id="terCell" type="number" min="1" max="50" step="1">
          <p class="hint" data-i18n="terrain.cellHint"></p>
          <label class="lbl" for="terMinPatch" data-i18n="terrain.minPatch"></label>
          <input id="terMinPatch" type="number" min="0" step="50">
          <p class="hint" data-i18n="terrain.minPatchHint"></p>
        </details>
        <div class="btns"><button type="button" class="linkbtn" id="terClear" data-i18n="terrain.clear" hidden></button></div>
      </div>
      <div class="card">
        <div class="cardhd"><b data-i18n="terrain.limit"></b></div>
        <label class="lbl" for="terTech" data-i18n="terrain.tech"></label>
        <select id="terTech">
          <option value="ground-fixed" data-i18n="tech.ground-fixed"></option>
          <option value="agri-fixed" data-i18n="tech.agri-fixed"></option>
          <option value="agri-tracker" data-i18n="tech.agri-tracker"></option>
        </select>
        <p class="hint" data-i18n="terrain.techHint"></p>
        <div id="terRule"></div>
        <label class="lbl" id="terLimitLabel" data-i18n="terrain.limitMode"></label>
        <div class="chips plain" id="terLimitMode" role="radiogroup" aria-labelledby="terLimitLabel">
          <button type="button" class="chip" role="radio" data-lmode="toolkit" aria-checked="true" data-i18n="terrain.modeToolkit"></button>
          <button type="button" class="chip" role="radio" data-lmode="any" aria-checked="false" data-i18n="terrain.modeAny"></button>
          <button type="button" class="chip" role="radio" data-lmode="nsew" aria-checked="false" data-i18n="terrain.modeNsew"></button>
        </div>
        <div class="row2" id="terLimitAny" hidden>
          <div><label class="lbl" for="terMaxAny" data-i18n="terrain.maxAny"></label><input id="terMaxAny" type="number" min="0" max="100" step="0.5"></div>
        </div>
        <div class="row2" id="terLimitNsew" hidden>
          <div><label class="lbl" for="terMaxNS" data-i18n="terrain.maxNS"></label><input id="terMaxNS" type="number" min="0" max="100" step="0.5"></div>
          <div><label class="lbl" for="terMaxEW" data-i18n="terrain.maxEW"></label><input id="terMaxEW" type="number" min="0" max="100" step="0.5"></div>
        </div>
        <div class="status" id="terLimitStatus" role="status"></div>
        <p class="hint" data-i18n="terrain.limitHint"></p>
        <label class="chk"><input type="checkbox" id="terApply"> <span data-i18n="terrain.apply"></span></label>
      </div>
      <div class="card">
        <div class="cardhd"><b data-i18n="terrain.slope"></b></div>
        <div id="terStats"></div>
        <label class="chk"><input type="checkbox" id="terShow"> <span data-i18n="terrain.show"></span></label>
        <div class="chips plain" id="terView" role="radiogroup" data-i18n-aria="terrain.view">
          <button type="button" class="chip" role="radio" data-view="s" aria-checked="true" data-i18n="terrain.viewS"></button>
          <button type="button" class="chip" role="radio" data-view="z" aria-checked="false" data-i18n="terrain.viewZ"></button>
        </div>
        <div class="legend" id="terLegend"></div>
      </div>
    </section>

    <!-- 3 · layout -->
    <section class="step" data-step="fields" hidden>
      <header class="stephd"><span class="num">3</span><div><h2 data-i18n="step.fields"></h2><p data-i18n="step.fields.sub"></p></div></header>
      <button type="button" class="sticky" id="fSticky" data-i18n-title="res.stickyTitle" hidden></button>

      <details class="fold" id="secField" open>
        <summary><span class="ico" aria-hidden="true"><svg class="icon" focusable="false"><use href="#i-sun"/></svg></span><span class="ttl"><b data-i18n="field.title"></b><small data-i18n="field.sub"></small></span></summary>
        <div class="bd">
          <label class="lbl" for="fTech" data-i18n="field.tech"></label>
          <select id="fTech">
            <option value="ground-fixed" data-i18n="tech.ground-fixed"></option>
            <option value="agri-fixed" data-i18n="tech.agri-fixed"></option>
            <option value="agri-tracker" data-i18n="tech.agri-tracker"></option>
          </select>
          <label class="lbl" for="fStructSel" data-i18n="field.structure"></label>
          <select id="fStructSel"></select>
          <div id="fStructBox" hidden>
            <label class="lbl" for="fStruct" data-i18n="field.structureCustom"></label>
            <input id="fStruct" type="text" list="structPresets" autocomplete="off">
            <datalist id="structPresets"></datalist>
          </div>
          <div class="hint" id="fStructHint"></div>
          <label class="lbl" for="fModule" data-i18n="field.module"></label>
          <select id="fModule"></select>
          <div id="fPeriodBox" hidden>
            <label class="lbl" for="fPeriod" data-i18n="field.period"></label>
            <select id="fPeriod"></select>
            <div class="hint" data-i18n="field.periodHint"></div>
          </div>
          <div class="row2">
            <div id="fTiltBox"><label class="lbl" for="fTilt" data-i18n="field.tilt"></label><input id="fTilt" type="number" min="0" max="60" step="0.5"></div>
            <div><label class="lbl" for="fAz" data-i18n="field.azimuth"></label><input id="fAz" type="number" min="0" max="360" step="1"></div>
          </div>
          <div class="hint" data-i18n="field.azimuthHint"></div>
          <label class="lbl" for="fPitch" data-i18n="field.pitch"></label>
          <input id="fPitch" type="number" min="0.5" step="0.01">
          <div class="hint" id="fPitchHint"></div>
          <div class="hint" id="fOptHint"></div>
          <details class="adv" id="fAdv">
            <summary data-i18n="field.adv" data-icon="info"></summary>
            <div class="row2">
              <div><label class="lbl" for="fTableGap" data-i18n="field.tableGap"></label><input id="fTableGap" type="number" min="0" step="0.01"></div>
              <div><label class="lbl" for="fModGap" data-i18n="field.moduleGap"></label><input id="fModGap" type="number" min="0" step="0.005"></div>
            </div>
            <label class="chk"><input type="checkbox" id="fTracks"> <span data-i18n="field.tracks"></span></label>
            <div class="row3">
              <div><label class="lbl" for="fTrackEvery" data-i18n="field.tracksEvery"></label><input id="fTrackEvery" type="number" min="10" step="1"></div>
              <div><label class="lbl" for="fTrackTables" data-i18n="field.tracksTables"></label><input id="fTrackTables" type="number" min="1" step="1"></div>
              <div><label class="lbl" for="fTrackWidth" data-i18n="field.tracksWidth"></label><input id="fTrackWidth" type="number" min="0" step="0.5"></div>
            </div>
            <label class="chk"><input type="checkbox" id="fHalf"> <span data-i18n="field.half"></span></label>
            <div class="hint" id="fHalfHint"></div>
            <label class="lbl" for="fTarget"><span data-i18n="field.target"></span> <span class="opt" data-i18n="field.optional"></span></label>
            <input id="fTarget" type="number" min="0" step="0.1">
            <label class="lbl" data-i18n="field.position"></label>
            <div class="row2">
              <div><label class="lbl" for="fRowOff" data-i18n="field.rowOffset"></label><input id="fRowOff" type="number" min="0" step="0.1"></div>
              <div><label class="lbl" for="fColOff" data-i18n="field.colOffset"></label><input id="fColOff" type="number" min="0" step="0.1"></div>
            </div>
          </details>
        </div>
      </details>

      <details class="fold" id="secResults" open>
        <summary><span class="ico" aria-hidden="true"><svg class="icon" focusable="false"><use href="#i-chart"/></svg></span><span class="ttl"><b data-i18n="res.title"></b><small data-i18n="res.sub"></small></span></summary>
        <div class="bd">
          <div class="results" id="kpis"></div>
          <label class="lbl" for="specYield" data-i18n="res.specYield"></label>
          <input id="specYield" type="number" min="0" step="1">
          <div class="hint" data-i18n="res.specYieldHint"></div>
          <div class="warns" id="warns"></div>
          <details class="gloss"><summary data-i18n="res.gloss" data-icon="info"></summary>
            <ul><li data-i18n="res.gl1"></li><li data-i18n="res.gl2"></li><li data-i18n="res.gl3"></li><li data-i18n="res.gl4"></li></ul>
          </details>
        </div>
      </details>

      <details class="fold" id="secModules">
        <summary><span class="ico" aria-hidden="true"><svg class="icon" focusable="false"><use href="#i-table"/></svg></span><span class="ttl"><b data-i18n="mod.title"></b><small data-i18n="mod.sub"></small></span><span class="cnt" id="modCnt"></span></summary>
        <div class="bd">
          <div class="list" id="modList" data-i18n-empty="mod.empty"></div>
          <div class="btns">
            <button type="button" class="btn" id="modAddBtn" data-icon="plus" data-i18n="mod.add"></button>
            <button type="button" class="btn" id="modImportBtn" data-icon="import" data-i18n="mod.import" data-i18n-title="mod.importTitle"></button>
          </div>
          <form id="modForm" hidden>
            <div class="row2">
              <div><label class="lbl" for="mfMan" data-i18n="mod.manufacturer"></label><input id="mfMan" type="text"></div>
              <div><label class="lbl" for="mfModel" data-i18n="mod.model"></label><input id="mfModel" type="text"></div>
            </div>
            <div class="row3">
              <div><label class="lbl" for="mfWp" data-i18n="mod.wp"></label><input id="mfWp" type="number" min="1" step="1"></div>
              <div><label class="lbl" for="mfLen" data-i18n="mod.length"></label><input id="mfLen" type="number" min="0" step="any"></div>
              <div><label class="lbl" for="mfWid" data-i18n="mod.width"></label><input id="mfWid" type="number" min="0" step="any"></div>
            </div>
            <label class="chk"><input type="checkbox" id="mfBif"> <span data-i18n="mod.bifacial"></span></label>
            <div class="hint" data-i18n="mod.dimsHint"></div>
            <div class="btns">
              <button type="submit" class="btn primary" data-i18n="mod.save"></button>
              <button type="button" class="btn" id="mfCancel" data-i18n="mod.cancel"></button>
            </div>
          </form>
          <div class="hint" id="modHint" data-i18n="mod.hint"></div>
        </div>
      </details>
    </section>

    <!-- 4 · infra -->
    <section class="step" data-step="infra" hidden>
      <header class="stephd"><span class="num">4</span><div><h2 data-i18n="step.infra"></h2><p data-i18n="step.infra.sub"></p></div></header>
      <p class="hint" data-i18n="infra.intro"></p>
      <details class="gloss"><summary data-i18n="infra.gloss" data-icon="info"></summary>
        <ul><li data-i18n="infra.introMore1"></li><li data-i18n="infra.introMore2"></li></ul>
      </details>
      <div class="card">
        <div class="cardhd"><b data-i18n="infra.fence"></b></div>
        <label class="chk"><input type="checkbox" id="infFence"> <span data-i18n="infra.fenceOn"></span></label>
        <div id="infFenceInfo"></div>
        <div id="infLotsBox" hidden>
          <p class="hint" id="infLotsHint"></p>
          <div class="list" id="infLots"></div>
          <div class="btns">
            <button type="button" class="btn" id="infJoin" data-i18n="infra.join"></button>
            <button type="button" class="btn" id="infSeparate" data-i18n="infra.separate"></button>
          </div>
        </div>
        <label class="lbl" for="infClear" data-i18n="infra.clear"></label>
        <input id="infClear" type="number" min="0" step="0.5">
        <p class="hint" id="infClearHint"></p>
      </div>
      <div class="card">
        <div class="cardhd"><b data-i18n="infra.road"></b></div>
        <label class="chk"><input type="checkbox" id="infRoad"> <span data-i18n="infra.roadOn"></span></label>
        <div id="infRoadInfo"></div>
      </div>
      <div class="card">
        <div class="cardhd"><b data-i18n="infra.roads"></b></div>
        <div id="infRoads"></div>
        <div class="row2">
          <div><select id="infRoadKind" data-i18n-aria="infra.roadKindLabel"><option value="heavy"></option><option value="light"></option></select></div>
          <div><button type="button" class="btn" id="infRoadDraw" data-icon="road" data-i18n="infra.drawRoad"></button></div>
        </div>
        <div class="list" id="infRoadList" data-i18n-empty="infra.roadListNone"></div>
      </div>
      <div class="card">
        <div class="cardhd"><b data-i18n="infra.gates"></b></div>
        <div id="infGates"></div>
      </div>
      <div class="card">
        <div class="cardhd"><b data-i18n="infra.stations"></b></div>
        <div class="btns"><button type="button" class="linkbtn" id="infAtAccess" data-i18n="infra.atAccess"></button></div>
        <div class="list" id="infStations" data-i18n-empty="infra.stationsNone"></div>
        <p class="hint" id="infStationsHint"></p>
      </div>
    </section>

    <!-- 5 · output -->
    <section class="step" data-step="output" hidden>
      <header class="stephd"><span class="num">5</span><div><h2 data-i18n="step.output"></h2><p data-i18n="step.output.sub"></p></div></header>
      <!-- the outputs in the order of use: a first look (PDF, KMZ), then the files for Engineering and GIS -->
      <div class="card">
        <div class="cardhd"><b data-i18n="out.lookTitle"></b></div>
        <p class="hint" data-i18n="out.lookHint"></p>
        <details class="gloss"><summary data-i18n="out.gloss" data-icon="info"></summary>
          <ul><li data-i18n="out.reportHint"></li><li data-i18n="out.kmlMore"></li></ul>
        </details>
      </div>
      <div class="card">
        <div class="cardhd"><b data-i18n="out.engTitle"></b></div>
        <p class="hint" data-i18n="out.crsWhere"></p>
        <div id="outCrsAlerts" class="warns"></div>
        <p class="hint" data-i18n="out.engShort"></p>
        <details class="gloss"><summary data-i18n="out.gloss" data-icon="info"></summary>
          <ul><li data-i18n="out.crsInfo"></li><li data-i18n="out.engHint"></li><li data-i18n="out.exportHint"></li></ul>
        </details>
      </div>
      <p class="hint" data-i18n="elec.hint"></p>
    </section>


    </div>
  </aside>
</main>

<footer id="statusbar" class="statusbar">
  <span class="it xy"><span class="k">E</span><span class="v" id="sbE">—</span></span>
  <span class="it xy"><span class="k">N</span><span class="v" id="sbN">—</span></span>
  <label class="it sb-crs"><span class="k" data-i18n="sb.crs"></span><select id="outCrs" data-i18n-aria="out.crsTitle" data-i18n-title="top.crsTitle"></select></label>
  <span class="it"><span class="k" data-i18n="sb.scale"></span><span class="v" id="sbScale">—</span></span>
  <span class="spacer"></span>
  <span id="sbMode" data-i18n="sb.select"></span>
  <button type="button" class="sb-toggle" id="sbSnap" aria-pressed="true"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-snap"/></svg><span></span></button>
  <span id="sbSave" data-i18n="sb.autosave"></span>
</footer>
</div>

<div id="toast" aria-live="polite"></div>
<input type="file" id="fileImport" accept=".axpo,.geojson,.json,.kml,.kmz,.zip,.csv,.txt,.dwg,.dxf" multiple hidden>
<input type="file" id="fileProject" accept=".pvpd" hidden>
<input type="file" id="fileRoadmap" accept=".xlsx,.xlsm,.xls,.csv" hidden>
<input type="file" id="fileDtm" accept=".tif,.tiff" hidden>
<script type="module" src="./js/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PV Predesign</title>
<link rel="stylesheet" id="esriTheme" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.34/"></script>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<header id="top">
  <div class="brand">PV Predesign<small data-i18n="app.subtitle"></small></div>
  <input id="projName" type="text" data-i18n-aria="top.projName" data-i18n-title="top.projName">
  <div class="actions">
    <div class="grp">
      <button class="tb" id="btnNew" data-i18n="top.new" data-i18n-title="top.newTitle"></button>
      <button class="tb" id="btnOpen" data-i18n="top.open" data-i18n-title="top.openTitle"></button>
      <button class="tb" id="btnSave" data-i18n="top.save" data-i18n-title="top.saveTitle"></button>
      <button class="tb" id="btnSaveAs" data-i18n="top.saveAs" data-i18n-title="top.saveAsTitle"></button>
    </div>
    <button class="tb" id="btnImport" data-i18n="top.import" data-i18n-title="top.importTitle"></button>
    <button class="tb quick" id="btnQuick" data-i18n="quick.btn" data-i18n-title="quick.btnTitle"></button>
    <button class="tb crs" id="crsBadge" data-i18n-title="top.crsTitle"></button>
    <button class="tb" id="btnTheme" data-i18n-title="top.theme" data-i18n-aria="top.theme">☾</button>
  </div>
</header>

<div id="body">
  <nav id="rail" data-i18n-aria="rail.label">
    <button type="button" data-step="areas"><span class="n">1</span><span class="badge" id="railAreas"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l8-4 8 5-2.5 11L6 20z"/><path d="M10 10l4 1-1 4-3.5-1z"/></svg>
      <span class="lb" data-i18n="step.areas"></span><span class="fig"></span><span class="sr"></span></button>
    <button type="button" data-step="terrain"><span class="n">2</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 19l6.5-10 4 6 2.5-3.5L22 19z"/><path d="M6 13.5c2-.8 3.5-.8 5 0"/></svg>
      <span class="lb" data-i18n="step.terrain"></span><span class="fig"></span><span class="sr"></span></button>
    <button type="button" data-step="fields"><span class="n">3</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14l-2 4H3z"/><path d="M5 10h14l-2 4H3z"/><path d="M5 16h14l-2 4H3z"/></svg>
      <span class="lb" data-i18n="step.fields"></span><span class="fig"></span><span class="sr"></span></button>
    <button type="button" data-step="infra"><span class="n">4</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21L9.5 3M19 21L14.5 3"/><path d="M12 6v2M12 11v2.5M12 17v3"/></svg>
      <span class="lb" data-i18n="step.infra.short"></span><span class="fig"></span><span class="sr"></span></button>
    <button type="button" data-step="output"><span class="n">5</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M12 10v7M9 14l3 3 3-3"/></svg>
      <span class="lb" data-i18n="step.output"></span><span class="fig"></span><span class="sr"></span></button>
  </nav>

  <aside id="side">

    <!-- 1 · site -->
    <section class="step" data-step="areas" hidden>
      <header class="stephd"><span class="num">1</span><div><h2 data-i18n="step.areas"></h2><p data-i18n="step.areas.sub"></p></div></header>
      <div class="btns"><button type="button" class="btn primary" id="areasImport" data-i18n="areas.import"></button></div>
      <p class="hint" data-i18n="areas.importHint"></p>
      <details class="gloss"><summary data-i18n="areas.gloss2"></summary>
        <ul><li data-i18n="areas.importMore1"></li><li data-i18n="areas.importMore2"></li><li data-i18n="areas.importMore3"></li></ul>
      </details>
      <!-- the quick predesign is offered only once there is a site: one primary action per step -->
      <p class="suggest" id="areasQuickRow" hidden><span data-i18n="quick.siteReady"></span>
        <button type="button" class="linkbtn" id="areasQuick" data-i18n="quick.btn" data-i18n-title="quick.btnTitle"></button></p>
      <details class="sec" id="secDraw" open>
        <summary><span class="ico" aria-hidden="true">✎</span><span class="ttl"><b data-i18n="draw.title"></b><small data-i18n="draw.sub"></small></span></summary>
        <div class="bd">
          <div class="pstep">
            <div class="pstep-h"><span class="pnum" aria-hidden="true">1</span><div class="pstep-t"><b data-i18n="draw.what"></b><small data-i18n="draw.whatSub"></small></div></div>
            <div class="chips" id="drawCats" role="radiogroup" data-i18n-aria="draw.what"></div>
            <div class="attrs2" id="drawAttrs" hidden></div>
          </div>
          <div class="pstep">
            <div class="pstep-h"><span class="pnum" aria-hidden="true">2</span><div class="pstep-t"><b data-i18n="draw.how"></b><small data-i18n="draw.howSub"></small></div>
              <div class="acts"><button type="button" class="gact" id="drawUndo" data-i18n-title="draw.undo" data-i18n-aria="draw.undo" disabled>↶</button><button type="button" class="gact" id="drawRedo" data-i18n-title="draw.redo" data-i18n-aria="draw.redo" disabled>↷</button></div></div>
            <div class="cards" id="drawTools"></div>
            <div class="status" id="drawStatus" role="status"></div>
          </div>
          <div class="last" id="drawLast" hidden></div>
        </div>
      </details>
      <p class="hint coll-hint"><span data-i18n="areas.collHint"></span> <a href="#" data-coll-open data-i18n="areas.collOpen"></a></p>
      <div class="card">
        <div class="cardhd"><b data-i18n="areas.netTitle"></b></div>
        <label class="l" for="boundarySetback" data-i18n="areas.setback"></label>
        <input id="boundarySetback" type="number" min="0" step="0.5">
        <p class="hint" data-i18n="areas.setbackHint"></p>
        <div id="areaSummary"></div>
        <details class="gloss"><summary data-i18n="areas.gloss"></summary>
          <ul><li data-i18n="areas.gl1"></li><li data-i18n="areas.gl2"></li><li data-i18n="areas.gl3"></li><li data-i18n="areas.gl4"></li></ul>
        </details>
      </div>
    </section>

    <!-- 2 · terrain -->
    <section class="step" data-step="terrain" hidden>
      <header class="stephd"><span class="num">2</span><div><h2 data-i18n="step.terrain"></h2><p data-i18n="step.terrain.sub"></p></div></header>
      <p class="hint" data-i18n="terrain.intro"></p>
      <details class="gloss"><summary data-i18n="terrain.gloss"></summary>
        <ul><li data-i18n="terrain.introMore1"></li><li data-i18n="terrain.introMore2"></li></ul>
      </details>
      <div class="card">
        <div class="cardhd"><b data-i18n="terrain.model"></b><span class="pill" id="terPill"></span></div>
        <div id="terInfo"></div>
        <div class="btns col">
          <button type="button" class="btn primary" id="terEsri" data-i18n="terrain.esriBtn"></button>
          <button type="button" class="btn" id="terDtm" data-i18n="terrain.dtmBtn"></button>
        </div>
        <div id="terStatus" class="status" role="status" hidden></div>
        <p class="hint" data-i18n="terrain.esriHint"></p>
        <details class="adv">
          <summary data-i18n="terrain.adv"></summary>
          <label class="l" for="terCell" data-i18n="terrain.cell"></label>
          <input id="terCell" type="number" min="1" max="50" step="1">
          <p class="hint" data-i18n="terrain.cellHint"></p>
          <label class="l" for="terMinPatch" data-i18n="terrain.minPatch"></label>
          <input id="terMinPatch" type="number" min="0" step="50">
          <p class="hint" data-i18n="terrain.minPatchHint"></p>
        </details>
        <div class="btns"><button type="button" class="linkbtn" id="terClear" data-i18n="terrain.clear" hidden></button></div>
      </div>
      <div class="card">
        <div class="cardhd"><b data-i18n="terrain.limit"></b></div>
        <label class="l" for="terTech" data-i18n="terrain.tech"></label>
        <select id="terTech">
          <option value="ground-fixed" data-i18n="tech.ground-fixed"></option>
          <option value="agri-fixed" data-i18n="tech.agri-fixed"></option>
          <option value="agri-tracker" data-i18n="tech.agri-tracker"></option>
        </select>
        <p class="hint" data-i18n="terrain.techHint"></p>
        <div id="terRule"></div>
        <label class="l" id="terLimitLabel" data-i18n="terrain.limitMode"></label>
        <div class="chips plain" id="terLimitMode" role="radiogroup" aria-labelledby="terLimitLabel">
          <button type="button" role="radio" data-lmode="toolkit" aria-checked="true" data-i18n="terrain.modeToolkit"></button>
          <button type="button" role="radio" data-lmode="any" aria-checked="false" data-i18n="terrain.modeAny"></button>
          <button type="button" role="radio" data-lmode="nsew" aria-checked="false" data-i18n="terrain.modeNsew"></button>
        </div>
        <div class="row2" id="terLimitAny" hidden>
          <div><label class="l" for="terMaxAny" data-i18n="terrain.maxAny"></label><input id="terMaxAny" type="number" min="0" max="100" step="0.5"></div>
        </div>
        <div class="row2" id="terLimitNsew" hidden>
          <div><label class="l" for="terMaxNS" data-i18n="terrain.maxNS"></label><input id="terMaxNS" type="number" min="0" max="100" step="0.5"></div>
          <div><label class="l" for="terMaxEW" data-i18n="terrain.maxEW"></label><input id="terMaxEW" type="number" min="0" max="100" step="0.5"></div>
        </div>
        <div class="status" id="terLimitStatus" role="status"></div>
        <p class="hint" data-i18n="terrain.limitHint"></p>
        <label class="chk"><input type="checkbox" id="terApply"> <span data-i18n="terrain.apply"></span></label>
      </div>
      <div class="card">
        <div class="cardhd"><b data-i18n="terrain.slope"></b></div>
        <div id="terStats"></div>
        <label class="chk"><input type="checkbox" id="terShow"> <span data-i18n="terrain.show"></span></label>
        <div class="chips plain" id="terView" role="radiogroup" data-i18n-aria="terrain.view">
          <button type="button" role="radio" data-view="s" aria-checked="true" data-i18n="terrain.viewS"></button>
          <button type="button" role="radio" data-view="z" aria-checked="false" data-i18n="terrain.viewZ"></button>
        </div>
        <div class="legend" id="terLegend"></div>
      </div>
    </section>

    <!-- 3 · layout -->
    <section class="step" data-step="fields" hidden>
      <header class="stephd"><span class="num">3</span><div><h2 data-i18n="step.fields"></h2><p data-i18n="step.fields.sub"></p></div></header>
      <button type="button" class="sticky" id="fSticky" data-i18n-title="res.stickyTitle" hidden></button>

      <details class="sec" id="secField" open>
        <summary><span class="ico" aria-hidden="true">☀</span><span class="ttl"><b data-i18n="field.title"></b><small data-i18n="field.sub"></small></span></summary>
        <div class="bd">
          <label class="l" for="fTech" data-i18n="field.tech"></label>
          <select id="fTech">
            <option value="ground-fixed" data-i18n="tech.ground-fixed"></option>
            <option value="agri-fixed" data-i18n="tech.agri-fixed"></option>
            <option value="agri-tracker" data-i18n="tech.agri-tracker"></option>
          </select>
          <label class="l" for="fStructSel" data-i18n="field.structure"></label>
          <select id="fStructSel"></select>
          <div id="fStructBox" hidden>
            <label class="l" for="fStruct" data-i18n="field.structureCustom"></label>
            <input id="fStruct" type="text" list="structPresets" autocomplete="off">
            <datalist id="structPresets"></datalist>
          </div>
          <div class="hint" id="fStructHint"></div>
          <label class="l" for="fModule" data-i18n="field.module"></label>
          <select id="fModule"></select>
          <div id="fPeriodBox" hidden>
            <label class="l" for="fPeriod" data-i18n="field.period"></label>
            <select id="fPeriod"></select>
            <div class="hint" data-i18n="field.periodHint"></div>
          </div>
          <div class="row2">
            <div id="fTiltBox"><label class="l" for="fTilt" data-i18n="field.tilt"></label><input id="fTilt" type="number" min="0" max="60" step="0.5"></div>
            <div><label class="l" for="fAz" data-i18n="field.azimuth"></label><input id="fAz" type="number" min="0" max="360" step="1"></div>
          </div>
          <div class="hint" data-i18n="field.azimuthHint"></div>
          <label class="l" for="fPitch" data-i18n="field.pitch"></label>
          <input id="fPitch" type="number" min="0.5" step="0.01">
          <div class="hint" id="fPitchHint"></div>
          <div class="btns"><button type="button" class="btn" id="fOptimise" data-i18n="field.optimise"></button></div>
          <div class="hint" id="fOptHint"></div>
          <details class="adv" id="fAdv">
            <summary data-i18n="field.adv"></summary>
            <div class="row2">
              <div><label class="l" for="fTableGap" data-i18n="field.tableGap"></label><input id="fTableGap" type="number" min="0" step="0.01"></div>
              <div><label class="l" for="fModGap" data-i18n="field.moduleGap"></label><input id="fModGap" type="number" min="0" step="0.005"></div>
            </div>
            <label class="chk"><input type="checkbox" id="fTracks"> <span data-i18n="field.tracks"></span></label>
            <div class="row3">
              <div><label class="l" for="fTrackEvery" data-i18n="field.tracksEvery"></label><input id="fTrackEvery" type="number" min="10" step="1"></div>
              <div><label class="l" for="fTrackTables" data-i18n="field.tracksTables"></label><input id="fTrackTables" type="number" min="1" step="1"></div>
              <div><label class="l" for="fTrackWidth" data-i18n="field.tracksWidth"></label><input id="fTrackWidth" type="number" min="0" step="0.5"></div>
            </div>
            <label class="chk"><input type="checkbox" id="fHalf"> <span data-i18n="field.half"></span></label>
            <div class="hint" id="fHalfHint"></div>
            <label class="l" for="fTarget"><span data-i18n="field.target"></span> <span class="opt" data-i18n="field.optional"></span></label>
            <input id="fTarget" type="number" min="0" step="0.1">
            <label class="l" data-i18n="field.position"></label>
            <div class="row2">
              <div><label class="l" for="fRowOff" data-i18n="field.rowOffset"></label><input id="fRowOff" type="number" min="0" step="0.1"></div>
              <div><label class="l" for="fColOff" data-i18n="field.colOffset"></label><input id="fColOff" type="number" min="0" step="0.1"></div>
            </div>
          </details>
        </div>
      </details>
      <!-- the quick predesign as an alternative to the parameters above, not above them -->
      <p class="suggest"><span data-i18n="quick.fieldsHint"></span>
        <button type="button" class="linkbtn" id="fQuick" data-i18n="quick.btn" data-i18n-title="quick.btnTitle"></button></p>

      <details class="sec" id="secResults" open>
        <summary><span class="ico" aria-hidden="true">📊</span><span class="ttl"><b data-i18n="res.title"></b><small data-i18n="res.sub"></small></span></summary>
        <div class="bd">
          <div class="results" id="kpis"></div>
          <label class="l" for="specYield" data-i18n="res.specYield"></label>
          <input id="specYield" type="number" min="0" step="1">
          <div class="hint" data-i18n="res.specYieldHint"></div>
          <div class="warns" id="warns"></div>
          <details class="gloss"><summary data-i18n="res.gloss"></summary>
            <ul><li data-i18n="res.gl1"></li><li data-i18n="res.gl2"></li><li data-i18n="res.gl3"></li><li data-i18n="res.gl4"></li></ul>
          </details>
        </div>
      </details>

      <details class="sec" id="secModules">
        <summary><span class="ico" aria-hidden="true">▦</span><span class="ttl"><b data-i18n="mod.title"></b><small data-i18n="mod.sub"></small></span><span class="cnt" id="modCnt"></span></summary>
        <div class="bd">
          <div class="list" id="modList" data-i18n-empty="mod.empty"></div>
          <div class="btns">
            <button type="button" class="btn" id="modAddBtn" data-i18n="mod.add"></button>
            <button type="button" class="btn" id="modImportBtn" data-i18n="mod.import" data-i18n-title="mod.importTitle"></button>
          </div>
          <form id="modForm" hidden>
            <div class="row2">
              <div><label class="l" for="mfMan" data-i18n="mod.manufacturer"></label><input id="mfMan" type="text"></div>
              <div><label class="l" for="mfModel" data-i18n="mod.model"></label><input id="mfModel" type="text"></div>
            </div>
            <div class="row3">
              <div><label class="l" for="mfWp" data-i18n="mod.wp"></label><input id="mfWp" type="number" min="1" step="1"></div>
              <div><label class="l" for="mfLen" data-i18n="mod.length"></label><input id="mfLen" type="number" min="0" step="any"></div>
              <div><label class="l" for="mfWid" data-i18n="mod.width"></label><input id="mfWid" type="number" min="0" step="any"></div>
            </div>
            <label class="chk"><input type="checkbox" id="mfBif"> <span data-i18n="mod.bifacial"></span></label>
            <div class="hint" data-i18n="mod.dimsHint"></div>
            <div class="btns">
              <button type="submit" class="btn primary" data-i18n="mod.save"></button>
              <button type="button" class="btn" id="mfCancel" data-i18n="mod.cancel"></button>
            </div>
          </form>
          <div class="hint" id="modHint" data-i18n="mod.hint"></div>
        </div>
      </details>
    </section>

    <!-- 4 · infra -->
    <section class="step" data-step="infra" hidden>
      <header class="stephd"><span class="num">4</span><div><h2 data-i18n="step.infra"></h2><p data-i18n="step.infra.sub"></p></div></header>
      <p class="hint" data-i18n="infra.intro"></p>
      <details class="gloss"><summary data-i18n="infra.gloss"></summary>
        <ul><li data-i18n="infra.introMore1"></li><li data-i18n="infra.introMore2"></li></ul>
      </details>
      <div class="card">
        <div class="cardhd"><b data-i18n="infra.fence"></b></div>
        <label class="chk"><input type="checkbox" id="infFence"> <span data-i18n="infra.fenceOn"></span></label>
        <div id="infFenceInfo"></div>
        <div id="infLotsBox" hidden>
          <p class="hint" id="infLotsHint"></p>
          <div class="list" id="infLots"></div>
          <div class="btns">
            <button type="button" class="btn" id="infJoin" data-i18n="infra.join"></button>
            <button type="button" class="btn" id="infSeparate" data-i18n="infra.separate"></button>
          </div>
        </div>
        <label class="l" for="infClear" data-i18n="infra.clear"></label>
        <input id="infClear" type="number" min="0" step="0.5">
        <p class="hint" id="infClearHint"></p>
      </div>
      <div class="card">
        <div class="cardhd"><b data-i18n="infra.road"></b></div>
        <label class="chk"><input type="checkbox" id="infRoad"> <span data-i18n="infra.roadOn"></span></label>
        <div id="infRoadInfo"></div>
      </div>
      <div class="card">
        <div class="cardhd"><b data-i18n="infra.roads"></b></div>
        <div id="infRoads"></div>
        <div class="row2">
          <div><select id="infRoadKind" data-i18n-aria="infra.roadKindLabel"><option value="heavy"></option><option value="light"></option></select></div>
          <div><button type="button" class="btn" id="infRoadDraw" data-i18n="infra.drawRoad"></button></div>
        </div>
        <div class="list" id="infRoadList" data-i18n-empty="infra.roadListNone"></div>
      </div>
      <div class="card">
        <div class="cardhd"><b data-i18n="infra.gates"></b></div>
        <div id="infGates"></div>
      </div>
      <div class="card">
        <div class="cardhd"><b data-i18n="infra.stations"></b></div>
        <div class="btns">
          <button type="button" class="btn" id="infCC" data-i18n="infra.addCC"></button>
          <button type="button" class="btn" id="infCU" data-i18n="infra.addCU"></button>
          <button type="button" class="btn" id="infCT" data-i18n="infra.addCT"></button>
        </div>
        <div class="btns"><button type="button" class="linkbtn" id="infAtAccess" data-i18n="infra.atAccess"></button></div>
        <div class="list" id="infStations" data-i18n-empty="infra.stationsNone"></div>
        <p class="hint" id="infStationsHint"></p>
      </div>
    </section>

    <!-- 5 · output -->
    <section class="step" data-step="output" hidden>
      <header class="stephd"><span class="num">5</span><div><h2 data-i18n="step.output"></h2><p data-i18n="step.output.sub"></p></div></header>
      <!-- the outputs in the order of use: a first look (PDF, KMZ), then the files for Engineering and GIS -->
      <div class="card">
        <div class="cardhd"><b data-i18n="out.lookTitle"></b></div>
        <div class="btns col">
          <button type="button" class="btn primary" id="outReport" data-i18n="out.reportBtn"></button>
          <button type="button" class="btn" id="outKml" data-i18n="out.kml"></button>
        </div>
        <p class="hint" data-i18n="out.lookHint"></p>
        <details class="gloss"><summary data-i18n="out.gloss"></summary>
          <ul><li data-i18n="out.reportHint"></li><li data-i18n="out.kmlMore"></li></ul>
        </details>
      </div>
      <div class="card">
        <div class="cardhd"><b data-i18n="out.engTitle"></b></div>
        <label class="l" for="outCrs" data-i18n="out.crsTitle"></label>
        <select id="outCrs" data-i18n-aria="out.crsTitle"></select>
        <div id="outCrsAlerts" class="warns"></div>
        <div class="btns col">
          <button type="button" class="btn" id="outShp" data-i18n="out.shp"></button>
          <button type="button" class="btn" id="outGpkg" data-i18n="out.gpkg"></button>
          <button type="button" class="btn" id="outDxf" data-i18n="out.dxf"></button>
          <button type="button" class="btn" id="outBoq" data-i18n="out.boq"></button>
          <button type="button" class="btn" id="outGeojson" data-i18n="out.geojson"></button>
        </div>
        <p class="hint" data-i18n="out.engShort"></p>
        <details class="gloss"><summary data-i18n="out.gloss"></summary>
          <ul><li data-i18n="out.crsInfo"></li><li data-i18n="out.engHint"></li><li data-i18n="out.exportHint"></li></ul>
        </details>
      </div>
      <p class="hint" data-i18n="elec.hint"></p>
    </section>

  </aside>
  <div id="mapStack">
    <div id="view"><div id="banner" hidden></div></div>
    <div id="view3d"></div>
    <!-- 2D / 3D is a view of the map, not a step: the side panel keeps its step -->
    <!-- the scale bar, bottom centre (the SDK has no such corner: its own container) -->
    <div id="scalebar"></div>
    <!-- Tools: drawing support and measures, bottom left (2D only) -->
    <div id="tools">
      <div id="toolsMenu" class="toolsmenu" role="group" data-i18n-aria="tools.title" hidden>
        <div class="tm-h" data-i18n="tools.support"></div>
        <button type="button" data-pref="snap" aria-pressed="true"><span data-i18n="tools.snap"></span><span class="st"></span></button>
        <button type="button" data-pref="typed" aria-pressed="true"><span data-i18n="tools.typed"></span><span class="st"></span></button>
        <button type="button" data-pref="labels" aria-pressed="true"><span data-i18n="tools.labels"></span><span class="st"></span></button>
        <div class="tm-h" data-i18n="tools.measure"></div>
        <button type="button" data-measure="distance" aria-pressed="false"><span data-i18n="tools.distance"></span></button>
        <button type="button" data-measure="area" aria-pressed="false"><span data-i18n="tools.area"></span></button>
      </div>
      <button type="button" id="toolsFab" class="fab" aria-expanded="false" aria-controls="toolsMenu" data-i18n-title="tools.title" data-i18n-aria="tools.title">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0 5 5L13 18a2.1 2.1 0 0 1-3-3z"/><path d="M4 20l5-5"/><path d="M19.5 4.5l-3 3"/></svg>
      </button>
    </div>
    <aside id="measureCard" class="mapcard measure" hidden>
      <div class="mapcard-h"><b id="measureTitle"></b><button type="button" class="x" id="measureClose" data-i18n-title="tools.measureClose" data-i18n-aria="tools.measureClose">×</button></div>
      <div class="mapcard-b"><div id="measureBox"></div><p class="hint" data-i18n="tools.measureHint"></p></div>
    </aside>
    <div class="mapchips" role="group" data-i18n-aria="map.mode">
      <button type="button" data-mode="2d" aria-pressed="true">2D</button>
      <button type="button" data-mode="3d" aria-pressed="false">3D</button>
    </div>
    <aside id="d3Card" class="mapcard">
      <div class="mapcard-h"><b data-i18n="d3.title"></b><button type="button" class="x" id="d3CardMin" data-i18n-title="d3.minimise" data-i18n-aria="d3.minimise">▾</button></div>
      <div class="mapcard-b"><div id="d3Panel"></div></div>
    </aside>
  </div>

  <!-- the Collection: the objects of the site by category, in a drawer on the right (closed by default) -->
  <aside id="coll" aria-labelledby="collTitle">
    <button type="button" id="collTab" aria-expanded="false" aria-controls="collPanel" data-i18n-title="coll.toggle">
      <span class="lb" data-i18n="coll.title"></span><span class="tot" id="collTot"></span><span class="dots" id="collDots"></span>
    </button>
    <div id="collPanel">
      <div class="coll-h"><div><b id="collTitle" data-i18n="coll.title"></b><small data-i18n="coll.sub"></small></div>
        <button type="button" class="x" id="collClose" data-i18n-title="coll.close" data-i18n-aria="coll.close">×</button></div>
      <div class="coll-b"><div id="areaCats"></div></div>
    </div>
  </aside>
</div>

<div id="toast" aria-live="polite"></div>
<input type="file" id="fileImport" accept=".axpo,.geojson,.json,.kml,.kmz,.zip,.csv,.txt,.dwg,.dxf" multiple hidden>
<input type="file" id="fileProject" accept=".pvpd" hidden>
<input type="file" id="fileRoadmap" accept=".xlsx,.xlsm,.xls,.csv" hidden>
<input type="file" id="fileDtm" accept=".tif,.tiff" hidden>
<script type="module" src="./js/main.js"></script>
</body>
</html>

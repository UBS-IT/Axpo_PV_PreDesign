<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PV Predesign · 3D scene tests</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.34/"></script>
<link rel="stylesheet" href="../app/css/tokens.css">
<link rel="stylesheet" href="../app/css/kit.css">
<link rel="stylesheet" href="../app/css/app.css">
<style>
  :root { --ok: #1f8a4c; --err: #c0392b; --mut: #667; --bg: #fff; --txt: #111; --line: #e3e6ea; }
  body { display: block; height: auto; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--txt); margin: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  #sum { margin: 0 0 16px; color: var(--mut); }
  table { border-collapse: collapse; width: 100%; max-width: 960px; }
  td { border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
  td.s { width: 56px; font-weight: 700; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  code { font-size: 12px; color: var(--mut); }
  #body { width: min(900px, 100%); height: 560px; flex: none; }
  /* the map stack of the app fills #body: its own rule is in shell.css (the layout of the app), not loaded here;
     without it the views took the whole window and the software WebGL of the CI drew twice the pixels */
  #body > #mapStack { position: relative; width: 100%; height: 100%; }
</style>
</head>
<body>
<h1>PV Predesign · 3D scene: the real SceneView of step 4b (needs WebGL)</h1>
<p id="sum">running…</p>
<table id="out"></table>
<div id="body"></div>
<script>window.__PVP_TEST__ = true;</script>
<script type="module" src="./scene3d.test.js"></script>
</body>
</html>
